name: Test and deploy

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run static, unit, and Worker validation
        run: npm run validate
      - name: Run desktop and mobile E2E tests
        run: npm run test:e2e
      - name: Upload E2E failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-staging:
    name: Deploy staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && vars.DEPLOYMENTS_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://dev.pascual-labs.com
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging --var GIT_COMMIT_SHA:${{ github.sha }}
      - name: Verify staging endpoints and content
        env:
          SITE_URL: https://dev.pascual-labs.com
        run: node scripts/verify-deployment.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live staging smoke tests
        env:
          E2E_BASE_URL: https://dev.pascual-labs.com
        run: npm run test:e2e:smoke
      - name: Upload staging smoke failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOYMENTS_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://pascual-labs.com
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env="" --var GIT_COMMIT_SHA:${{ github.sha }}
      - name: Verify production endpoints, content, and canonical redirect
        env:
          SITE_URL: https://pascual-labs.com
        run: node scripts/verify-deployment.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live production smoke tests
        env:
          E2E_BASE_URL: https://pascual-labs.com
        run: npm run test:e2e:smoke
      - name: Upload production smoke failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
